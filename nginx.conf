# Cloud Run 에서 SPA 를 서빙하는 최소 설정.
# /etc/nginx/nginx.conf 를 통째로 대체하므로 events·http 블록까지 여기 다 있다.

worker_processes auto;

# Cloud Run 은 stdout/stderr 를 로그로 수집한다. 파일로 쓰면 아무도 못 본다.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		application/javascript
		application/json
		image/svg+xml;

	server {
		# Cloud Run 의 기본 수신 포트. 컨테이너는 반드시 이 포트에서 들어야 한다.
		listen 8080;
		server_name _;

		root /usr/share/nginx/html;
		index index.html;

		# Vite 가 파일명에 해시를 붙이므로 오래 캐시해도 안전하다.
		location /assets/ {
			expires 1y;
			add_header Cache-Control "public, immutable";
			try_files $uri =404;
		}

		# index.html 까지 캐시되면 새로 배포해도 옛 화면이 보인다.
		location = /index.html {
			add_header Cache-Control "no-cache";
		}

		# SPA 라우팅. /instructions 같은 경로로 새로고침해도 404 대신 index.html 을 준다.
		# React Router 가 그 다음을 처리한다.
		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}
